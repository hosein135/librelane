<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LibreLane Web{% endblock %}</title>
  <link rel="stylesheet" href="/static/flow.css">
</head>
<body>
  <header class="site-header">
    <a href="{% url 'home' %}" class="brand">LibreLane Web</a>
    <span class="tagline">Colab notebook flow — sky130 SPM design</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll(".js-confirm-delete").forEach((btn) => {
      btn.addEventListener("click", (event) => {
        const runId = btn.dataset.runId || "";
        const ok = window.confirm(
          `Delete run #${runId}? This removes the database record and all files and directories created for this run.`
        );
        if (!ok) {
          event.preventDefault();
        }
      });
    });
  </script>
</body>
</html>
